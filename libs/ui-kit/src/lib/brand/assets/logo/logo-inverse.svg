<svg width="240" height="48" viewBox="0 0 240 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Forte Galpões — logo inverso">
  <title>Forte Galpões (inverso — para fundos escuros)</title>
  <!-- Uso: sobre fundos navy, dark ou fotográficos escuros -->
  <defs>
    <clipPath id="inv-clip">
      <rect width="48" height="48" rx="6"/>
    </clipPath>
  </defs>

  <!-- ── Badge inverso: fundo branco translúcido ────────────────────────── -->
  <rect width="48" height="48" rx="6" fill="rgba(255,255,255,0.12)"/>
  <rect width="48" height="48" rx="6" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect y="42" width="48" height="6" fill="#E87722" clip-path="url(#inv-clip)"/>
  <text
    x="24" y="29"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-weight="800" font-size="20" fill="#FFFFFF"
    text-anchor="middle" letter-spacing="-0.5">FG</text>

  <!-- ── Wordmark inverso: texto branco ─────────────────────────────────── -->
  <rect x="60" y="8" width="1.5" height="32" rx="0.75" fill="rgba(255,255,255,0.35)"/>

  <text
    x="70" y="24"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-weight="700" font-size="15" fill="#FFFFFF"
    letter-spacing="0.04em">FORTE GALPÕES</text>

  <text
    x="70" y="37"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-weight="400" font-size="8" fill="rgba(255,255,255,0.65)"
    letter-spacing="0.12em">CORRETAGEM DE IMÓVEIS</text>
</svg>
