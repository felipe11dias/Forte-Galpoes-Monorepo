<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" role="img" aria-label="Forte Galpões — monocromático escuro">
  <!-- Versão monocromática preta — para impressão e fundos claros -->

  <!-- Brandmark mono dark -->
  <rect x="0" y="28" width="48" height="28" rx="1.5" fill="#1C2733"/>
  <path d="M-4 30 L24 8 L52 30" stroke="#1C2733" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="#1C2733"/>
  <rect x="21" y="6" width="6" height="5" rx="1" fill="#1C2733"/>
  <rect x="8" y="32" width="5" height="20" rx="1" fill="#F5F2ED"/>
  <rect x="8" y="32" width="16" height="5" rx="1" fill="#F5F2ED"/>
  <rect x="8" y="40" width="12" height="4" rx="1" fill="#F5F2ED"/>
  <rect x="33" y="32" width="5" height="20" rx="1" fill="#1C2733"/>
  <rect x="30" y="44" width="10" height="12" rx="1" fill="#0A1118"/>
  <rect x="-4" y="27" width="56" height="3" rx="1" fill="#1C2733"/>

  <!-- Divider -->
  <rect x="68" y="12" width="1.5" height="40" rx="0.75" fill="#1C2733" opacity="0.3"/>

  <!-- FORTE -->
  <text
    x="80"
    y="34"
    font-family="'Barlow Condensed', 'Arial Narrow', sans-serif"
    font-size="28"
    font-weight="900"
    fill="#1C2733"
    letter-spacing="-0.5"
  >FORTE</text>

  <!-- GALPÕES -->
  <text
    x="82"
    y="52"
    font-family="'Barlow Condensed', 'Arial Narrow', sans-serif"
    font-size="13"
    font-weight="400"
    fill="#1C2733"
    letter-spacing="3.5"
  >GALPÕES</text>
</svg>
