<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Forte Galpões — PWA Icon 512×512</title>
  <!-- 512×512 — ícone PWA mascarável / splash screen -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Badge 384×384 centralizado (padding 64px) -->
  <defs>
    <clipPath id="pwa512-clip">
      <rect x="64" y="64" width="384" height="384" rx="48"/>
    </clipPath>
  </defs>
  <rect x="64" y="64" width="384" height="384" rx="48" fill="#1C3F73"/>
  <rect x="64" y="400" width="384" height="48" fill="#E87722" clip-path="url(#pwa512-clip)"/>
  <text
    x="256" y="296"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-weight="800" font-size="160" fill="#FFFFFF"
    text-anchor="middle" letter-spacing="-4">FG</text>
</svg>
