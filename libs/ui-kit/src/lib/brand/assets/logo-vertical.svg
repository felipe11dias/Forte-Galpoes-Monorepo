<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" role="img" aria-label="Forte Galpões">
  <!-- Brandmark centered — 64x64, offset x=48 to center in 160px -->
  <rect x="56" y="20" width="48" height="28" rx="1.5" fill="#1C2733"/>
  <path d="M52 22 L80 0 L108 22" stroke="#1C2733" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="#1C2733"/>
  <rect x="77" y="-2" width="6" height="5" rx="1" fill="#A57340"/>
  <rect x="64" y="24" width="5" height="20" rx="1" fill="#F5F2ED"/>
  <rect x="64" y="24" width="16" height="5" rx="1" fill="#F5F2ED"/>
  <rect x="64" y="32" width="12" height="4" rx="1" fill="#F5F2ED"/>
  <rect x="89" y="24" width="5" height="20" rx="1" fill="#A57340"/>
  <rect x="86" y="36" width="10" height="12" rx="1" fill="#0A1118"/>
  <rect x="52" y="19" width="56" height="3" rx="1" fill="#A57340"/>

  <!-- Divider line below symbol -->
  <rect x="60" y="55" width="40" height="1.5" rx="0.75" fill="#5A6A7A" opacity="0.35"/>

  <!-- FORTE centered -->
  <text
    x="80"
    y="82"
    font-family="'Barlow Condensed', 'Arial Narrow', sans-serif"
    font-size="28"
    font-weight="900"
    fill="#1C2733"
    text-anchor="middle"
    letter-spacing="-0.5"
  >FORTE</text>

  <!-- GALPÕES centered, wide tracking -->
  <text
    x="80"
    y="100"
    font-family="'Barlow Condensed', 'Arial Narrow', sans-serif"
    font-size="12"
    font-weight="400"
    fill="#A57340"
    text-anchor="middle"
    letter-spacing="4"
  >GALPÕES</text>
</svg>
